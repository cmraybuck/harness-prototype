[project]
name = "harness-prototype"
version = "0.1.0"
description = "FLUX — a local-first software engineering agent powered by Ollama"
readme = "README.md"

requires-python = ">=3.12"
dependencies = [
    "ollama>=0.6.2",
    "pillow>=11.3.0",
    "pypdf>=6.1.0",
    "python-docx>=1.2.0",
    "python-dotenv>=1.2.3",
    "pyyaml>=6.0.2",
]

[project.scripts]
flux = "harness_prototype.main:main"

[project.gui-scripts]
flux-desktop = "harness_prototype.desktop:desktop_main"

[build-system]
requires = ["uv_build>=0.12.3,<0.13.0"]
build-backend = "uv_build"
